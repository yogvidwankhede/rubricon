name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {python: ["3.12", "3.13", "3.14"]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: make validate test
      # Gate-v2 doctest: run the public-function examples in attenuation.py
      - run: python3 -m pytest --doctest-modules src/rubricon/gates/attenuation.py -v
  reproduce:
    # Regenerate every committed artefact and fail if any byte differs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.12"}
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: make all
      - run: git diff --exit-code -- results/
